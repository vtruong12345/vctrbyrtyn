<style>
:root{color-scheme:dark;--bg:#14171b;--surface:#20252a;--ink:#e9e6e0;--muted:#a3aaa9;--stroke:#ffffff16;--accent:#a6c5bc;--warm:#c9ad9e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 12%,#50625a38,transparent 42%),radial-gradient(ellipse at 89% 87%,#755e5933,transparent 42%),var(--bg);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.18;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.17'/%3E%3C/svg%3E")}.wrap{max-width:650px;margin:0 auto;padding:70px 20px 46px}.card{border:1px solid var(--stroke);background:linear-gradient(150deg,#ffffff0b,#ffffff03);box-shadow:0 25px 90px #0005;border-radius:27px;backdrop-filter:blur(16px);padding:37px 32px;animation:entrance .75s both}.top{display:flex;align-items:center;gap:22px}.avatar{width:96px;height:96px;flex:none;border-radius:28px;object-fit:cover;background:linear-gradient(135deg,#97b7a8,#725d65);border:3px solid #ffffff16;box-shadow:0 12px 30px #0005}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}.name{font-size:clamp(24px,5vw,36px);line-height:1.17;letter-spacing:-.045em;margin:7px 0}.handle{color:var(--muted);font-size:13px}.bio{color:#d0d1cc;margin:25px 0 22px;max-width:48ch}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #ffffff15;background:#ffffff09;padding:6px 11px;border-radius:20px;font-size:12px;color:#cfdbd5}.heading{display:flex;align-items:center;justify-content:space-between;margin:32px 0 13px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b7beba}.count{color:#8b9f98;letter-spacing:0}.links{display:grid;gap:10px}.link{display:flex;align-items:center;gap:15px;min-height:70px;padding:12px 16px;border-radius:17px;background:#ffffff07;border:1px solid #ffffff12;text-decoration:none;color:inherit;transition:transform .25s,background .25s,border-color .25s,box-shadow .25s;animation:rise .55s both;animation-delay:calc(var(--i)*65ms)}.link:hover,.link:focus-visible{background:#a6c5bc12;border-color:#a6c5bc55;transform:translateY(-3px);box-shadow:0 12px 25px #0002;outline:none}.brand{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:#ffffff0d;color:#d7e6e0}.brand svg{width:23px;height:23px;fill:currentColor}.linktext{flex:1;min-width:0}.linktext strong{display:block;font-size:14px}.linktext small{display:block;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.arrow{color:#8e9994;font-size:19px}.player{display:flex;align-items:center;gap:13px;margin-top:13px;padding:13px 14px;border-radius:18px;border:1px solid #ffffff14;background:linear-gradient(110deg,#a6c5bc14,#c9ad9e10)}.play{display:grid;place-items:center;flex:none;width:43px;height:43px;border:0;border-radius:50%;color:#1c2623;background:var(--accent);cursor:pointer;transition:transform .2s}.play:hover{transform:scale(1.08)}.play svg{width:19px;height:19px;fill:currentColor}.track{flex:1;min-width:0}.track b,.track small{display:block}.track b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track small{color:var(--muted);font-size:11px}.progress{margin-top:8px;height:4px;width:100%;background:#ffffff20;border-radius:12px;cursor:pointer;overflow:hidden}.progress i{display:block;background:var(--accent);height:100%;width:0%;border-radius:12px}.upload{cursor:pointer;border:1px solid #ffffff24;border-radius:10px;padding:7px 10px;font-size:11px;color:#ccd9d2;white-space:nowrap}.upload input{display:none}.foot{text-align:center;color:#89928e;font-size:11px;margin:25px 0 0;letter-spacing:.06em}.foot span{color:var(--warm)}.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:.17;animation:float 11s ease-in-out infinite alternate}.orb.one{width:260px;height:260px;background:#97b7a8;top:4%;left:-100px}.orb.two{width:230px;height:230px;background:#aa827b;right:-100px;bottom:3%;animation-delay:-4s}@keyframes float{to{transform:translate(26px,-32px)}}@keyframes entrance{from{opacity:0;transform:translateY(19px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.wrap{padding:32px 14px}.card{padding:26px 19px}.top{gap:15px}.avatar{width:76px;height:76px;border-radius:22px}.link{min-height:66px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

const icons={

const $=id=>document.getElementById(id);
const fallbackAvatar='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#8ca99d"/><circle cx="64" cy="47" r="22" fill="#dbe7df"/><path d="M21 124c0-26 16-43 43-43s43 17 43 43" fill="#dbe7df"/></svg>');
$('avatar').src=PROFILE.avatar||fallbackAvatar;$('avatar').onerror=()=>{$('avatar').src=fallbackAvatar};$('name').textContent=PROFILE.name;$('handle').textContent=PROFILE.handle;$('bio').textContent=PROFILE.bio;
PROFILE.tags.forEach(t=>{let s=document.createElement('span');s.className='chip';s.textContent=t;$('tags').append(s)});
PROFILE.links.forEach((l,i)=>{if(!/^(https?:\/\/|mailto:|tel:)/i.test(l.url))return;const a=document.createElement('a');a.className='link';a.style.setProperty('--i',i);a.href=l.url;a.target=l.url.startsWith('http')?'_blank':'_self';if(a.target==='_blank')a.rel='noopener noreferrer';const ico=document.createElement('span');ico.className='brand';ico.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[l.app]||icons.link)+'</svg>';const t=document.createElement('span');t.className='linktext';const strong=document.createElement('strong');strong.textContent=l.title;const small=document.createElement('small');small.textContent=l.desc||l.url;t.append(strong,small);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';a.append(ico,t,arrow);$('links').append(a)});$('linkCount').textContent=String($('links').children.length).padStart(2,'0')+' LINKS';
const audio=$('audio'),play=$('play'),path=$('playPath');let blobURL='';
function setSource(src,title){audio.pause();audio.src=src;audio.load();$('songTitle').textContent=title;$('songStatus').textContent='Sẵn sàng phát';$('bar').style.width='0%';refresh()}
function refresh(){const playing=!audio.paused;path.setAttribute('d',playing?'M6 4h4v16H6zm8 0h4v16h-4z':'M8 5v14l11-7z');play.setAttribute('aria-label',playing?'Tạm dừng':'Phát nhạc')}
if(PROFILE.music)setSource(PROFILE.music,PROFILE.musicTitle);
play.addEventListener('click',async()=>{if(!audio.src){$('songStatus').textContent='Chọn + Nhạc để thêm file';return}try{if(audio.paused)await audio.play();else audio.pause()}catch(e){$('songStatus').textContent='Không phát được tệp nhạc'}refresh()});audio.addEventListener('play',refresh);audio.addEventListener('pause',refresh);audio.addEventListener('ended',refresh);audio.addEventListener('timeupdate',()=>{const pct=audio.duration?audio.currentTime/audio.duration*100:0;$('bar').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',Math.round(pct));if(Number.isFinite(audio.duration))$('songStatus').textContent=format(audio.currentTime)+' / '+format(audio.duration)});function format(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function seek(p){if(audio.duration&&Number.isFinite(audio.duration))audio.currentTime=Math.max(0,Math.min(1,p))*audio.duration}
$('progress').addEventListener('click',e=>seek((e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth));$('progress').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();seek((audio.currentTime+(e.key==='ArrowRight'?5:-5))/audio.duration)}});
$('audioFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(file);setSource(blobURL,file.name.replace(/\.[^.]+$/,''))});
